# Bind to all interfaces inside Docker network
bind 0.0.0.0

# No password by default (protected by Docker network)
# Uncomment and set if you want password auth:
# requirepass your_redis_password

# Persistence: RDB snapshot
save 900 1
save 300 10
save 60 10000

# AOF (Append Only File) — more durable, slightly slower
appendonly yes
appendfsync everysec

# Max memory: 256mb, then evict LRU keys
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Database count (we use db 0 for app, db 1 for tests)
databases 16

# Disable dangerous commands in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
