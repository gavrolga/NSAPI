# Load definitions on startup (queues, exchanges, bindings)
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info

# Connection limits
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true

# Heartbeat (seconds). Keeps connections alive between Laravel and RabbitMQ.
heartbeat = 60

# Memory threshold before RabbitMQ starts throttling publishers (80% of RAM)
vm_memory_high_watermark.relative = 0.8

# Disk free limit — stop accepting messages if disk drops below this
disk_free_limit.absolute = 500MB
