services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: ns_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/local.ini
        environment:
            - APP_ENV=${APP_ENV:-local}
            - APP_KEY=${APP_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - ns_network
        user: "1000:1000"
    nginx:
        image: nginx:1.25-alpine
        container_name: ns_nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_started
        networks:
            - ns_network
    worker:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: ns_worker
        restart: unless-stopped
        working_dir: /var/www
        user: "1000:1000"
        command: php artisan queue:work redis --queue=high,low --tries=3 --timeout=60 --sleep=3
        volumes:
            - .:/var/www
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/local.ini
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - ns_network
